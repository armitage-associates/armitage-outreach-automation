name: Monthly GOWT High Scrape

on:
  schedule:
    - cron: '0 14 28 * *'
  # 28th of every month at midnight AEST (14:00 UTC)

  workflow_dispatch:
    inputs:
      month:
        description: 'Month label (e.g. "Jun 2026"). Leave empty to auto-detect.'
        required: false

concurrency:
  group: monthly-scrape-high
  cancel-in-progress: true

env:
  BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
  SALESFORCE_DOMAIN: ${{ secrets.SALESFORCE_DOMAIN }}
  CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
  CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - run: pip install requests openpyxl python-dotenv

    - name: Scrape GOWT High companies
      run: |
        MONTH_FLAG=""
        if [ -n "${{ github.event.inputs.month }}" ]; then
          MONTH_FLAG="--month \"${{ github.event.inputs.month }}\""
        fi
        eval python linkedin_news_scrape.py --priority high $MONTH_FLAG

    - name: Commit updated Excel
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add GOWT_high.xlsx
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        MONTH=$(python -c "from datetime import datetime; print(datetime.now().strftime('%b %Y'))")
        git commit -m "Monthly scrape (High): ${MONTH}"
        git push
