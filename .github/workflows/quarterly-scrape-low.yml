name: Quarterly GOWT Low Scrape

on:
#   schedule:
#     - cron: '0 0 6 1,4,7,10 *'
#     - cron: '0 0 7 1,4,7,10 *'
#     - cron: '0 0 8 1,4,7,10 *'
#     - cron: '0 0 9 1,4,7,10 *'
#     - cron: '0 0 10 1,4,7,10 *'
#     - cron: '0 0 11 1,4,7,10 *'
#     - cron: '0 0 12 1,4,7,10 *'
#     - cron: '0 0 13 1,4,7,10 *'
#   # Days 6-13 of Jan/Apr/Jul/Oct (after Medium finishes days 1-5)

  workflow_dispatch:
    inputs:
      slice:
        description: 'Slice to process (1/8 through 8/8). Leave empty to auto-detect from date.'
        required: false

concurrency:
  group: quarterly-scrape-low-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

env:
  BATCH_SIZE: 5
  COMPANY_LIMIT: 0
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  FIRMABLE_API_KEY: ${{ secrets.FIRMABLE_API_KEY }}
  BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
  SALESFORCE_DOMAIN: ${{ secrets.SALESFORCE_DOMAIN }}
  SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
  SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
  SALESFORCE_SECURITY_TOKEN: ${{ secrets.SALESFORCE_SECURITY_TOKEN }}
  CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
  CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}

jobs:
  import:
    runs-on: ubuntu-latest
    outputs:
      total_batches: ${{ steps.plan.outputs.total_batches }}
      job1_batches: ${{ steps.plan.outputs.job1_batches }}
      job2_batches: ${{ steps.plan.outputs.job2_batches }}
      job3_batches: ${{ steps.plan.outputs.job3_batches }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: mkdir -p data/input data/output

    - name: Determine slice
      id: slice
      run: |
        if [ -n "${{ github.event.inputs.slice }}" ]; then
          SLICE="${{ github.event.inputs.slice }}"
        else
          DAY=$(date -u +%-d)
          if [ "$DAY" -gt 8 ]; then DAY=8; fi
          SLICE="${DAY}/8"
        fi
        echo "slice=$SLICE" >> $GITHUB_OUTPUT
        echo "Processing slice: $SLICE"

    - name: Import GOWT Low companies from Salesforce
      run: python salesforce.py --quarterly --priority Low --slice ${{ steps.slice.outputs.slice }}

    - name: Calculate batch plan
      id: plan
      run: |
        COMPANY_COUNT=$(( $(wc -l < data/input/companies.csv) - 1 ))
        echo "Company count: $COMPANY_COUNT"

        if [ "$COMPANY_LIMIT" -gt 0 ] && [ "$COMPANY_COUNT" -gt "$COMPANY_LIMIT" ]; then
          echo "Limiting to $COMPANY_LIMIT companies (from $COMPANY_COUNT)"
          COMPANY_COUNT=$COMPANY_LIMIT
        fi

        TOTAL=$(( (COMPANY_COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))
        if [ "$TOTAL" -lt 1 ]; then TOTAL=1; fi
        echo "Total batches: $TOTAL"

        PER_JOB=$(( (TOTAL + 2) / 3 ))

        JOB1_START=1
        JOB1_END=$PER_JOB
        if [ "$JOB1_END" -gt "$TOTAL" ]; then JOB1_END=$TOTAL; fi

        JOB2_START=$(( JOB1_END + 1 ))
        JOB2_END=$(( JOB1_END + PER_JOB ))
        if [ "$JOB2_END" -gt "$TOTAL" ]; then JOB2_END=$TOTAL; fi

        JOB3_START=$(( JOB2_END + 1 ))
        JOB3_END=$TOTAL

        JOB1_BATCHES=""
        for i in $(seq $JOB1_START $JOB1_END); do JOB1_BATCHES="$JOB1_BATCHES $i"; done

        JOB2_BATCHES=""
        if [ "$JOB2_START" -le "$TOTAL" ]; then
          for i in $(seq $JOB2_START $JOB2_END); do JOB2_BATCHES="$JOB2_BATCHES $i"; done
        fi

        JOB3_BATCHES=""
        if [ "$JOB3_START" -le "$TOTAL" ]; then
          for i in $(seq $JOB3_START $JOB3_END); do JOB3_BATCHES="$JOB3_BATCHES $i"; done
        fi

        echo "Job 1 batches:$JOB1_BATCHES"
        echo "Job 2 batches:$JOB2_BATCHES"
        echo "Job 3 batches:$JOB3_BATCHES"

        echo "total_batches=$TOTAL" >> $GITHUB_OUTPUT
        echo "job1_batches=$JOB1_BATCHES" >> $GITHUB_OUTPUT
        echo "job2_batches=$JOB2_BATCHES" >> $GITHUB_OUTPUT
        echo "job3_batches=$JOB3_BATCHES" >> $GITHUB_OUTPUT

    - name: Upload input data
      uses: actions/upload-artifact@v4
      with:
        name: input-data
        path: data/input/
        retention-days: 1

  scrape-1:
    needs: import
    if: needs.import.outputs.job1_batches != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: mkdir -p data/input data/output

    - name: Download input data
      uses: actions/download-artifact@v4
      with:
        name: input-data
        path: data/input/

    - name: Scrape batches
      run: |
        TOTAL=${{ needs.import.outputs.total_batches }}
        for BATCH in ${{ needs.import.outputs.job1_batches }}; do
          echo "=== Scraping batch $BATCH/$TOTAL ==="
          LIMIT_FLAG=""
          if [ "$COMPANY_LIMIT" -gt 0 ]; then LIMIT_FLAG="--limit $COMPANY_LIMIT"; fi
          python main.py --scrape-only --skip-analysis --batch "$BATCH/$TOTAL" $LIMIT_FLAG
        done

    - name: Upload output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: output-part-1
        path: data/output/
        retention-days: 1

  scrape-2:
    needs: [import, scrape-1]
    if: "!cancelled() && needs.import.outputs.job2_batches != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: mkdir -p data/input data/output

    - name: Download input data
      uses: actions/download-artifact@v4
      with:
        name: input-data
        path: data/input/

    - name: Scrape batches
      run: |
        TOTAL=${{ needs.import.outputs.total_batches }}
        for BATCH in ${{ needs.import.outputs.job2_batches }}; do
          echo "=== Scraping batch $BATCH/$TOTAL ==="
          LIMIT_FLAG=""
          if [ "$COMPANY_LIMIT" -gt 0 ]; then LIMIT_FLAG="--limit $COMPANY_LIMIT"; fi
          python main.py --scrape-only --skip-analysis --batch "$BATCH/$TOTAL" $LIMIT_FLAG
        done

    - name: Upload output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: output-part-2
        path: data/output/
        retention-days: 1

  scrape-3:
    needs: [import, scrape-2]
    if: "!cancelled() && needs.import.outputs.job3_batches != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: mkdir -p data/input data/output

    - name: Download input data
      uses: actions/download-artifact@v4
      with:
        name: input-data
        path: data/input/

    - name: Scrape batches
      run: |
        TOTAL=${{ needs.import.outputs.total_batches }}
        for BATCH in ${{ needs.import.outputs.job3_batches }}; do
          echo "=== Scraping batch $BATCH/$TOTAL ==="
          LIMIT_FLAG=""
          if [ "$COMPANY_LIMIT" -gt 0 ]; then LIMIT_FLAG="--limit $COMPANY_LIMIT"; fi
          python main.py --scrape-only --skip-analysis --batch "$BATCH/$TOTAL" $LIMIT_FLAG
        done

    - name: Upload output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: output-part-3
        path: data/output/
        retention-days: 1

  deliver:
    needs: [import, scrape-1, scrape-2, scrape-3]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: mkdir -p data/input data/output

    - name: Download input data
      uses: actions/download-artifact@v4
      with:
        name: input-data
        path: data/input/

    - name: Download all scrape outputs
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: output-part-*
        path: data/output/
        merge-multiple: true

    - name: Check for output files
      run: |
        COUNT=$(find data/output -name '*.json' 2>/dev/null | wc -l)
        echo "Found $COUNT output JSON files"
        if [ "$COUNT" -eq 0 ]; then
          echo "::warning::No scrape output files found — skipping delivery"
          echo "SKIP_DELIVER=true" >> $GITHUB_ENV
        fi

    - name: Download Excel from OneDrive
      if: env.SKIP_DELIVER != 'true'
      run: python onedrive.py download GOWT_mid_low.xlsx

    - name: Write results to Excel
      if: env.SKIP_DELIVER != 'true'
      run: python main.py --to-excel

    - name: Upload Excel to OneDrive
      if: env.SKIP_DELIVER != 'true'
      run: python onedrive.py upload GOWT_mid_low.xlsx

    - name: Commit updated Excel
      if: env.SKIP_DELIVER != 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add GOWT_mid_low.xlsx
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        QUARTER=$(python -c "
        from datetime import datetime
        now = datetime.now()
        q = (now.month - 1) // 3 + 1
        print(f'Q{q} {now.year}')
        ")
        git commit -m "Quarterly scrape (Low): ${QUARTER}"
        git push

    - name: Upload final results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: results-${{ github.run_number }}
        path: data/output/*.json
        retention-days: 30
