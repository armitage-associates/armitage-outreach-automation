name: OneDrive Token Keepalive

on:
  schedule:
    - cron: '0 0 10 */2 *'
  # Runs on the 10th of every other month (Jan, Mar, May, Jul, Sep, Nov) — ~60 day intervals.
  # Keeps the OneDrive refresh token alive (expires after 90 days of inactivity).

  workflow_dispatch:

env:
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install requests python-dotenv
    - name: Ping OneDrive
      run: python onedrive.py download GOWT_mid_low.xlsx --output /tmp/keepalive_test.xlsx
